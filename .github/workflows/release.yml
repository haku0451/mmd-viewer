name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the stable MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check that the tag matches the Cargo version
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mmd-viewer") | .version')"
          if [[ "${cargo_version}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match the mmd-viewer version ${cargo_version} in Cargo.toml"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p mmd-viewer --target x86_64-pc-windows-msvc

      - name: Package
        id: package
        run: |
          name="mmd-viewer-${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc"
          mkdir -p "dist/${name}"
          cp target/x86_64-pc-windows-msvc/release/mmd-viewer.exe "dist/${name}/"
          cp README.md "dist/${name}/"
          (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
          echo "archive=dist/${name}.zip" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "${{ steps.version.outputs.tag }}"
            "${{ steps.package.outputs.archive }}"
            --title "MMD Viewer ${{ steps.version.outputs.version }}"
            --generate-notes
            --verify-tag
          )
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
